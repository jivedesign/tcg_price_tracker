name: collect
on:
  schedule:
    - cron: "30 21 * * *"   # after TCGCSV's ~20:00 UTC refresh
  workflow_dispatch:
    inputs:
      task:
        description: "daily | init-mtg | backfill-mtg"
        default: daily
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests ijson
      - run: python collect.py ${{ inputs.task || 'daily' }}
      - name: Commit data
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "data $(date -u +%F)"
          git push
